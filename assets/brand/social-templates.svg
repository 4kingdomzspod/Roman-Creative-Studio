<svg xmlns="http://www.w3.org/2000/svg" width="700" height="820" viewBox="0 0 700 820">
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>

  <!-- ===== PROFILE AVATAR 300x300 ===== -->
  <text x="350" y="24" font-size="11" fill="#888" text-anchor="middle" letter-spacing="1">PROFILE / AVATAR — 300 × 300 px</text>
  <rect x="200" y="34" width="300" height="300" rx="150" fill="#121417"/>
  <g transform="translate(350, 184)">
    <polygon points="0,-72 72,0 0,72 -72,0" fill="rgba(212,175,55,0.1)" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="0" y="11" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="3">RS</text>
  </g>
  <text x="350" y="350" font-size="11" fill="#9ca3af" text-anchor="middle" letter-spacing="1">ROMAN CREATIVE STUDIO</text>

  <!-- ===== COVER BANNER 600x150 ===== -->
  <text x="350" y="378" font-size="11" fill="#888" text-anchor="middle" letter-spacing="1">COVER BANNER — 600 × 150 px</text>
  <rect x="50" y="388" width="600" height="150" rx="8" fill="#121417"/>
  <rect x="50" y="526" width="600" height="3" rx="0" fill="#D4AF37" opacity="0.5"/>
  <!-- monogram left -->
  <g transform="translate(110, 463)">
    <polygon points="0,-38 38,0 0,38 -38,0" fill="rgba(212,175,55,0.08)" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="0" y="6" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1">RS</text>
  </g>
  <!-- studio name -->
  <text x="168" y="452" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.3">Roman Creative Studio</text>
  <text x="168" y="472" font-size="11" fill="#D4AF37" letter-spacing="1.5">PREMIUM WEB DESIGN</text>
  <!-- tagline right -->
  <text x="630" y="455" font-size="12" fill="#6b7280" text-anchor="end">Build. Grow. Scale.</text>
  <text x="630" y="474" font-size="11" fill="#4b5563" text-anchor="end">romancreativestudio.com</text>

  <!-- ===== SQUARE POST 300x300 ===== -->
  <text x="350" y="572" font-size="11" fill="#888" text-anchor="middle" letter-spacing="1">SQUARE POST — 1080 × 1080 px (shown at 300)</text>
  <rect x="200" y="582" width="300" height="300" rx="8" fill="#1B1E23"/>
  <!-- gold border -->
  <rect x="200" y="582" width="300" height="300" rx="8" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>
  <!-- gold accent top -->
  <rect x="200" y="582" width="300" height="4" rx="2" fill="#D4AF37"/>
  <!-- monogram -->
  <g transform="translate(350, 670)">
    <polygon points="0,-44 44,0 0,44 -44,0" fill="rgba(212,175,55,0.07)" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="0" y="7" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="2">RS</text>
  </g>
  <!-- headline placeholder -->
  <rect x="228" y="726" width="244" height="14" rx="3" fill="#374151"/>
  <rect x="252" y="748" width="196" height="10" rx="3" fill="#1f2937"/>
  <!-- studio name bottom -->
  <text x="350" y="862" font-size="10" fill="#6b7280" text-anchor="middle" letter-spacing="1">ROMAN CREATIVE STUDIO</text>
  <text x="350" y="877" font-size="9" fill="#4b5563" text-anchor="middle">romancreativestudio.com</text>
</svg>